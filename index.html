<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://0.peerjs.com wss://0.peerjs.com; media-src blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>fuXioNERD | Nota de prueba</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #17212b; background: #f4f7f8; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; }
    main { width: min(100% - 32px, 560px); margin: 0 auto; padding: 24px 0; }
    header { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #c8d2d6; padding-bottom: 18px; }
    strong { font-size: 24px; }
    header span { color: #465764; font-size: 14px; }
    form { padding-top: 28px; }
    label { display: block; margin-bottom: 10px; }
    input { width: 100%; height: 48px; border: 1px solid #566c78; border-radius: 4px; padding: 8px 12px; font: 22px ui-monospace, monospace; text-transform: uppercase; }
    button { min-height: 46px; border-radius: 4px; padding: 10px 18px; font: inherit; cursor: pointer; border: 1px solid #566c78; color: #17212b; background: #fff; }
    #note-start { background: #0d6f75; border-color: #0d6f75; color: white; margin-top: 14px; width: 100%; }
    button:disabled { opacity: .5; cursor: default; }
    #note-state { margin: 30px 0 12px; font-size: 18px; min-height: 24px; }
    #note-timer { font-size: 32px; font-variant-numeric: tabular-nums; margin: 0 0 24px; }
  </style>
  <script defer src="./peerjs.min.js"></script>
  <script type="module" src="./sender.js"></script>
</head>
<body>
  <main>
    <header><strong>fuXioNERD</strong><span>SOLO NOTA FICTICIA</span></header>
    <p>Sin Mensajes, SMS ni OTP reales. Sin audio.</p>
    <form id="note-pair-form" autocomplete="off">
      <label for="note-pair-code">Enlace de prueba</label>
      <input id="note-pair-code" name="pair" inputmode="text" maxlength="15" spellcheck="false" autocomplete="off" required>
      <button id="note-start" type="submit">Iniciar</button>
    </form>
    <p id="note-state" role="status">En espera</p>
    <p id="note-timer">05:00</p>
    <button id="note-stop" type="button" disabled>Detener</button>
  </main>
</body>
</html>
